version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: Grafana
    ports:
      - "3000:3000"
    restart: always
    # (Tùy chọn) Nếu muốn lưu dữ liệu cấu hình Grafana không bị mất khi restart container:
    # volumes:
    #   - grafana-storage:/var/lib/grafana

# volumes:
#   grafana-storage: